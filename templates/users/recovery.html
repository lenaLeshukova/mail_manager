{% extends 'base.html' %}
{% block content %}
<div class="card p-4 col-md-6 mx-auto shadow-sm">
    <h3 class="mb-3">Восстановление пароля</h3>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} mt-2">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <p class="text-muted small">Введите ваш Email. Новый пароль будет автоматически сгенерирован и отправлен на почту.</p>

    <form method="post" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_email" class="form-label">Ваш Email</label>
            <input type="email" name="email" id="id_email" class="form-control" required placeholder="name@example.com">
        </div>
        <button type="submit" class="btn btn-warning w-100 mt-2">Сбросить пароль</button>
    </form>
    <div class="text-center mt-3">
        <a href="{% url 'users:login' %}" class="text-decoration-none">Назад ко входу</a>
    </div>
</div>
{% endblock %}
