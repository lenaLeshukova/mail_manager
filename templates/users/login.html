{% extends 'base.html' %}
{% block content %}
<div class="card p-4 col-md-6 mx-auto shadow-sm">
    <h3 class="mb-4">Вход в систему</h3>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger mt-2">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100 mt-2">Войти</button>
    </form>
</div>
{% endblock %}
