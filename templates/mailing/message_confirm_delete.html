{% extends 'base.html' %}
{% block content %}
<div class="card p-4 col-md-6 mx-auto shadow-sm mt-4 text-center">
    <h3 class="text-danger mb-4">Удаление сообщения</h3>
    <p class="fs-5">Вы уверены, что хотите удалить сообщение "<strong>{{ object.title }}</strong>"?</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 justify-content-center mt-4">
            <button type="submit" class="btn btn-danger px-4">Удалить</button>
            <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary px-4">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
