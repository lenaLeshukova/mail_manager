{% extends 'base.html' %}
{% block content %}
<div class="card p-4 col-md-6 mx-auto shadow-sm mt-4">
    <h3 class="mb-4">{% if object %}Редактирование{% else %}Создание{% endif %} сообщения</h3>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-success flex-grow-1">Сохранить</button>
            <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
<script>
    document.querySelectorAll('input, textarea').forEach(el => el.classList.add('form-control'));
</script>
{% endblock %}
