{% extends 'base.html' %}

{% block content %}
<div class="card p-4 col-md-6 mx-auto shadow-sm mt-4 text-center">
    <h3 class="text-danger mb-4">Удаление клиента</h3>
    
    <p class="fs-5">
        Вы уверены, что хотите удалить клиента <strong>{{ object.full_name }}</strong>?
    </p>
    <p class="text-muted small">
        Это действие нельзя будет отменить. Клиент будет исключен из всех связанных рассылок.
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 justify-content-center mt-4">
            <button type="submit" class="btn btn-danger px-4">Да, удалить</button>
            <a href="{% url 'mailing:client_list' %}" class="btn btn-secondary px-4">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
